name: Python package

on: [push, pull_request]

jobs:
  build-windows:
    name: Windows build
    runs-on: windows-2022

    strategy:
      matrix:
        # 3.10 is the minimum for current yt-dlp (it requires >=3.10).
        # On 3.9 pip silently resolves to a year-old yt-dlp that no longer
        # works against youtube.
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v5
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install required Python packages
        run:   |
          pip install pillow
          pip install pycryptodome
          pip install requests
          pip install pycdlib
          pip install ecdsa
          pip install pyinstaller
          pip install pygubu
          pip install tkinterDnD2
          pip install "yt-dlp[default]"
          pip install PyPDF2
      - name: Clone make_npdata
        run:   |
          git clone https://github.com/sahlberg/make_npdata.git
      - name: Install ATRACDENC
        run:   |
          Invoke-WebRequest -OutFile atracdenc-x86_0.1.1.zip https://github.com/dcherednik/atracdenc/releases/download/0.1.1/atracdenc-win-x86_0.1.1.zip
          unzip -j atracdenc-x86_0.1.1 -x README.TXT
      - name: Build PSL1GHT
        run:   |
          git clone http://github.com/sahlberg/PSL1GHT
          cd PSL1GHT/tools/ps3py
          git checkout origin/use-python3
          make
          cd ../../..
          pyinstaller PSL1GHT/tools/ps3py/pkg.py
      - name: Install crunch.exe
        run:   |
          git clone https://github.com/BinomialLLC/crunch.git
      - name: Install CHDMAN
        run:   |
          Invoke-WebRequest -OutFile mame-binaries.exe https://github.com/mamedev/mame/releases/download/mame0289/mame0289b_x64.exe
          7z e mame-binaries.exe chdman.exe -y
          Remove-Item mame-binaries.exe
      - name: Install FFMPEG
        run:   |
          Invoke-WebRequest -OutFile ffmpeg-release-essentials.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          unzip -j ffmpeg-release-essentials.zip -x */doc/* -x */presets/* -x */README.txt -x */LICENSE -x */bin/ffplay.exe -x */bin/ffprobe.exe
      - name: Build pop-fe2
        run:   |
          pyinstaller --collect-all yt_dlp pop-fe2.py
      - name: Build pop-fe2-ps3
        run:   |
          cp pop-fe2.py popfe2.py
          pyinstaller --add-data "pop-fe2-ps3.ui;." pop-fe2-ps3.py --hidden-import pygubu.builder.tkstdwidgets --hidden-import pygubu.builder.ttkstdwidgets --hidden-import pygubu.builder.widgets.pathchooserinput --collect-all tkinterdnd2 --collect-all yt_dlp
      - name: Update dist/pop-fe2
        run:   |
          mkdir dist/pop-fe2/atracdenc
          mkdir dist/pop-fe2/atracdenc/src
          cp dist/pkg/pkg.exe dist/pop-fe2/.
          cp dist/pkg/pkgcrypt*.pyd dist/pop-fe2/.
          cp atracdenc.exe dist/pop-fe2/atracdenc/src/.
          mkdir dist/pop-fe2/make_npdata
          mkdir dist/pop-fe2/make_npdata/Linux
          cp make_npdata/Linux/make_npdata.exe dist/pop-fe2/make_npdata/Linux/.
          cp crunch/bin/crunch*.exe dist/pop-fe2/.
          cp chdman.exe dist/pop-fe2/.
          cp ffmpeg.exe dist/pop-fe2/.
          cp 2P0001-PS2U10000_00-0000111122223333.rap dist/pop-fe2/.
      - name: Update dist/pop-fe2-ps3
        run:   |
          mkdir dist/pop-fe2-ps3/atracdenc
          mkdir dist/pop-fe2-ps3/atracdenc/src
          cp atracdenc.exe dist/pop-fe2-ps3/atracdenc/src/.
          mkdir dist/pop-fe2-ps3/make_npdata
          mkdir dist/pop-fe2-ps3/make_npdata/Linux
          cp make_npdata/Linux/make_npdata.exe dist/pop-fe2-ps3/make_npdata/Linux/.
          cp crunch/bin/crunch*.exe dist/pop-fe2-ps3/.
          cp chdman.exe dist/pop-fe2-ps3/.
          cp ffmpeg.exe dist/pop-fe2-ps3/.
          cp 2P0001-PS2U10000_00-0000111122223333.rap dist/pop-fe2-ps3/.
          cp -r -Force dist/pkg/* dist/pop-fe2-ps3/.
          cp -r -Force dist/pop-fe2/* dist/pop-fe2-ps3/.
      - name: Upload pop-fe2-ui artefact
        uses: actions/upload-artifact@v6
        with: 
          name: pop-fe2-ui
          path: dist/pop-fe2-ps3

  build-linux-appimage:
    name: Linux AppImage build
    # The AppImage needs at least the glibc of the distro it was built on.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run:   |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsndfile1-dev mame-tools libtcl8.6 libtk8.6
      - name: Clone helpers
        run:   |
          rm -rf atracdenc make_npdata PSL1GHT
          git clone --recursive -b cstint-fix https://github.com/sahlberg/atracdenc.git
          git clone -b wip/hadess/modern-linux https://github.com/masible/make_npdata.git
          git clone -b use-python3 https://github.com/sahlberg/PSL1GHT.git
          git clone --depth 1 https://github.com/BinomialLLC/crunch.git
      - name: Build AppImage
        run:   |
          PYTHON=python ./appimage/build-appimage.sh
      - name: Upload AppImage artefact
        uses: actions/upload-artifact@v6
        with:
          name: pop-fe2-appimage
          path: dist/pop-fe2-x86_64.AppImage
